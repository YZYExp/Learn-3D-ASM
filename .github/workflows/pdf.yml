name: Export book PDFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'assets/images/**'
      - 'scripts/build_book.py'
      - 'scripts/prepare_font.py'
      - 'scripts/sync_pdfs.py'
      - 'scripts/validate_pdfs.py'
      - 'requirements.txt'
      - '.github/workflows/pdf.yml'

permissions:
  contents: read

concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/prepare_font.py
      - run: python scripts/build_book.py
      - run: python scripts/sync_pdfs.py
      - run: python scripts/validate_pdfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: manufacturing-book-pdfs
          path: pdf/
          if-no-files-found: error
          retention-days: 30
