name: Build book and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare Chinese font
        run: python scripts/prepare_font.py
      - name: Build book and reading site
        run: |
          python scripts/build_book.py
          python scripts/sync_pdfs.py
          python scripts/build_homepage.py
          python scripts/validate_site.py
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check build/homepage/content.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/homepage
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
